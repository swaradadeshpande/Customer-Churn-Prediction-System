<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChurnSense Analytics</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="left-panel">

        <h1>ChurnSense Analytics</h1>

        <p>
            AI-powered customer churn prediction system designed to identify customers at high risk of leaving.
        </p>

        <div class="stats">
            <div class="stat-card">
                <h2>79%</h2>
                <span>Model Accuracy</span>
            </div>

            <div class="stat-card">
                <h2>ML</h2>
                <span>XGBoost Model</span>
            </div>
        </div>

    </div>

    <div class="right-panel">

        <div class="form-card">

            <h2>Predict Customer Churn</h2>

            <form id="predictionForm">

                <div class="input-grid">

                    <div class="input-group">
                        <label>Tenure (Months)</label>
                        <input type="number" id="tenure" required>
                    </div>

                    <div class="input-group">
                        <label>Monthly Charges</label>
                        <input type="number" id="MonthlyCharges" required>
                    </div>

                    <div class="input-group">
                        <label>Total Charges</label>
                        <input type="number" id="TotalCharges" required>
                    </div>

                    <div class="input-group">
                        <label>Senior Citizen</label>
                        <select id="SeniorCitizen">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Partner</label>
                        <select id="Partner_Yes">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Dependents</label>
                        <select id="Dependents_Yes">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Online Security</label>
                        <select id="OnlineSecurity_Yes">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Tech Support</label>
                        <select id="TechSupport_Yes">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>One Year Contract</label>
                        <select id="Contract_One year">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Two Year Contract</label>
                        <select id="Contract_Two year">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Fiber Optic</label>
                        <select id="InternetService_Fiber optic">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Electronic Check</label>
                        <select id="PaymentMethod_Electronic check">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                </div>

                <button type="submit">
                    Predict Churn
                </button>

            </form>

            <div id="result"></div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
